# Verifies that the install commands documented for end users (README.md,
# QUICKSTART.md, docs/pages/getting-started.rst) still succeed in a clean
# virtual environment with stock pip against live PyPI. This complements the
# uv.lock-based CI, which never exercises the plain-pip resolver a first-time
# user hits.
name: install-smoke

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - README.md
      - QUICKSTART.md
      - docs/pages/getting-started.rst
      - docs/pages/troubleshooting.md
      - src/battinfo/_util.py
      - .github/workflows/install-smoke.yml
  pull_request:
    paths:
      - pyproject.toml
      - README.md
      - QUICKSTART.md
      - docs/pages/getting-started.rst
      - docs/pages/troubleshooting.md
      - src/battinfo/_util.py
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    name: pip install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip install -e .
        shell: bash
        run: |
          set -euxo pipefail
          v="$RUNNER_TEMP/venv-core"
          python -m venv "$v"
          if [ -f "$v/Scripts/python.exe" ]; then py="$v/Scripts/python.exe"; else py="$v/bin/python"; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -e .
          "$py" -c "import battinfo; print(battinfo.__version__)"

      - name: pip install -e ".[dev]"
        shell: bash
        run: |
          set -euxo pipefail
          v="$RUNNER_TEMP/venv-dev"
          python -m venv "$v"
          if [ -f "$v/Scripts/python.exe" ]; then py="$v/Scripts/python.exe"; else py="$v/bin/python"; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -e ".[dev]"
          "$py" -c "import battinfo; print(battinfo.__version__)"

      # The converter install the docs give, resolved by stock pip against live
      # PyPI. A small CSV is then converted, to prove the converter and its
      # Neware, Excel and MATLAB readers are importable.
      - name: pip install -e ".[processing]"
        shell: bash
        run: |
          set -euxo pipefail
          v="$RUNNER_TEMP/venv-processing"
          python -m venv "$v"
          if [ -f "$v/Scripts/python.exe" ]; then py="$v/Scripts/python.exe"; else py="$v/bin/python"; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -e ".[processing]"
          "$py" -c "import battinfo, importlib.metadata as m; print(battinfo.__version__, 'batterydf', m.version('batterydf'))"
          work="$RUNNER_TEMP/convert-smoke"
          mkdir -p "$work"
          printf 'test_time_second,voltage_volt,current_ampere\n0,3.7,1.0\n1,3.71,1.0\n' > "$work/export.csv"
          cd "$work"
          "$py" -c "import bdf, fastnda, fastexcel, scipy; import battinfo; ws = battinfo.workspace('.'); out = ws.convert('*.csv'); assert len(out) == 1, out; print(open(out[0]).readline().strip())"

      - name: pip install git+https://github.com/BIG-MAP/BattINFO.git
        shell: bash
        run: |
          set -euxo pipefail
          v="$RUNNER_TEMP/venv-git"
          python -m venv "$v"
          if [ -f "$v/Scripts/python.exe" ]; then py="$v/Scripts/python.exe"; else py="$v/bin/python"; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install "git+https://github.com/BIG-MAP/BattINFO.git"
          "$py" -c "import battinfo; print(battinfo.__version__)"

      # The install docs give that one converter line, and nothing in the repo
      # still tells readers to install batterydf from git. The steps above and
      # below run the line; this one only reads the docs.
      - name: documented converter install line
        shell: bash
        run: |
          set -euxo pipefail
          for doc in QUICKSTART.md README.md docs/pages/getting-started.rst docs/pages/troubleshooting.md; do
            grep -qF 'pip install "battinfo[processing]' "$doc"
          done
          if git grep -nE 'batterydf(\[[^]]*\])? *@ *git\+' -- . ':!CHANGELOG.md'; then
            echo "A batterydf git install line is still documented (listed above)."
            exit 1
          fi

      # What a PyPI user gets: the built wheel, stock pip, an empty environment,
      # a working directory outside the checkout. The core install runs the
      # first Quickstart step; a second environment installs the wheel with the
      # processing extra and converts a small CSV.
      - name: wheel in an empty environment, outside the checkout
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
          wheel=$(ls "$RUNNER_TEMP"/dist/battinfo-*.whl)
          v="$RUNNER_TEMP/venv-wheel"
          python -m venv "$v"
          if [ -f "$v/Scripts/python.exe" ]; then py="$v/Scripts/python.exe"; else py="$v/bin/python"; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install "$wheel"
          work="$RUNNER_TEMP/wheel-smoke"
          mkdir -p "$work"
          cd "$work"
          cat > quickstart.py <<'PY'
          import json
          import pathlib

          import battinfo
          from battinfo import CellSpec, publish, validate_record

          assert "site-packages" in pathlib.Path(battinfo.__file__).as_posix(), battinfo.__file__
          cell_spec = CellSpec(
              manufacturer="Panasonic",
              model="NCR18650B",
              format="cylindrical",
              chemistry="Li-ion",
              size_code="R18650",
              nominal_capacity={"value": 3.4, "unit": "Ah"},
              nominal_voltage={"value": 3.6, "unit": "V"},
              mass={"value": 48.0, "unit": "g"},
          )
          result = publish(cell_spec, destination="local", root=".battinfo/quickstart")
          assert result.canonical_iri.startswith("https://w3id.org/battinfo/spec/"), result.canonical_iri
          record = json.loads(pathlib.Path(result.debug_paths["canonical_record_path"]).read_text())
          validate_record(record)
          print("wheel ok", battinfo.__version__, result.canonical_iri)
          PY
          "$py" quickstart.py
          "$py" -c "from battinfo.registry import Registry; print(Registry())"
          v="$RUNNER_TEMP/venv-wheel-processing"
          python -m venv "$v"
          if [ -f "$v/Scripts/python.exe" ]; then py="$v/Scripts/python.exe"; else py="$v/bin/python"; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install "${wheel}[processing]"
          work="$RUNNER_TEMP/wheel-convert-smoke"
          mkdir -p "$work"
          cd "$work"
          printf 'test_time_second,voltage_volt,current_ampere\n0,3.7,1.0\n1,3.71,1.0\n' > export.csv
          cat > convert_smoke.py <<'PY'
          import importlib.metadata
          import pathlib

          import bdf, fastexcel, fastnda, scipy  # the converter and its Neware, Excel and MATLAB readers
          import battinfo

          assert "site-packages" in pathlib.Path(battinfo.__file__).as_posix(), battinfo.__file__
          out = battinfo.workspace(".").convert("*.csv")
          assert len(out) == 1, out
          print("convert ok, batterydf", importlib.metadata.version("batterydf"), open(out[0]).readline().strip())
          PY
          "$py" convert_smoke.py
