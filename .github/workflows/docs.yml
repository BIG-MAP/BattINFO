name: Docs

# Builds the Sphinx documentation and checks that the guide notebooks parse,
# so docs and the advertised notebooks cannot silently rot.
#
# The build is strict (-W): any Sphinx warning fails the job. Notebook
# *execution* (nbmake) is deferred — the notebooks ship with stored outputs
# (nbsphinx_execute = "never"), so this renders them without a kernel.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install pandoc (required by nbsphinx to render notebooks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install (locked, all extras)
        run: uv sync --all-extras --frozen
      - name: Sphinx build (warnings are errors)
        env:
          DOCS_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: uv run --no-sync sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Validate guide notebooks parse
        run: |
          uv run --no-sync python - <<'PY'
          import glob, nbformat
          nbs = sorted(glob.glob("docs/guides/*.ipynb"))
          for nb in nbs:
              nbformat.read(nb, as_version=4)
          print(f"OK: {len(nbs)} notebooks parsed")
          PY
      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html

  # Versioned deploy to gh-pages: main -> dev/, each v* tag -> its own folder.
  # A final release tag (vX.Y.Z) also updates switcher.json, and stable/ when
  # it is the newest release; a pre-release tag such as v0.8.0rc1 leaves both
  # alone (docs-deploy.sh). A final tag also publishes battinfo.ttl where w3id
  # serves the ontology from: battinfo/versions/X.Y.Z/, and the root when it is
  # the newest release, each with the battinfo-inferred.ttl ROBOT writes.
  # (Requires GitHub Pages to be enabled from the gh-pages branch.)
  deploy:
    name: Deploy versioned docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    # One deploy at a time. Each pushes to gh-pages, so the deploy of a release
    # tag that ran next to the deploy of the main commit it was cut from would
    # be refused at the push. A running deploy is never cancelled, but GitHub
    # keeps only the newest waiting one: if a third deploy queues while a tag's
    # deploy waits, the tag's is cancelled, so re-run it from the tag's run.
    concurrency:
      group: docs-deploy-gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The reasoner of a final tag gets 20 minutes (REASONER_TIMEOUT in
    # docs-deploy.sh); the rest of a deploy takes one or two.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/_build/html
      # ROBOT, run with the runner's Java, writes battinfo-inferred.ttl for a
      # final tag (a pre-release tag downloads it for nothing). The file is
      # optional: when this step fails or stalls, ROBOT stays unset, the next
      # step warns, and the deploy publishes the ontology without it.
      - name: Install ROBOT
        id: robot
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        timeout-minutes: 5
        env:
          ROBOT_VERSION: "1.9.10"
          ROBOT_SHA256: 16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105
        run: |
          curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/robot.jar" \
            "https://github.com/ontodev/robot/releases/download/v$ROBOT_VERSION/robot.jar"
          echo "$ROBOT_SHA256  $RUNNER_TEMP/robot.jar" | sha256sum --check --strict
          java -version
          echo "ROBOT=java -Xmx6g -jar $RUNNER_TEMP/robot.jar" >> "$GITHUB_ENV"
      - name: Warn that ROBOT is missing
        if: steps.robot.outcome == 'failure'
        env:
          TAG: ${{ github.ref_name }}
        run: echo "::warning::ROBOT could not be installed for $TAG; a final tag publishes its ontology without battinfo-inferred.ttl."
      - name: Deploy to GitHub Pages
        env:
          DOCS_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: bash .github/workflows/docs-deploy.sh "$DOCS_VERSION"
