name: Docs

# Builds the Sphinx documentation and checks that the guide notebooks parse,
# so docs and the advertised notebooks cannot silently rot.
#
# The build is strict (-W): any Sphinx warning fails the job. Notebook
# *execution* (nbmake) is deferred — the notebooks ship with stored outputs
# (nbsphinx_execute = "never"), so this renders them without a kernel.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install pandoc (required by nbsphinx to render notebooks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install (locked, all extras)
        run: uv sync --all-extras --frozen
      - name: Sphinx build (warnings are errors)
        env:
          DOCS_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: uv run --no-sync sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Validate guide notebooks parse
        run: |
          uv run --no-sync python - <<'PY'
          import glob, nbformat
          nbs = sorted(glob.glob("docs/guides/*.ipynb"))
          for nb in nbs:
              nbformat.read(nb, as_version=4)
          print(f"OK: {len(nbs)} notebooks parsed")
          PY
      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html

  # Versioned deploy to gh-pages: main -> dev/, each v* tag -> its own folder.
  # A final release tag (vX.Y.Z) also updates switcher.json, and stable/ when
  # it is the newest release; a pre-release tag such as v0.8.0rc1 leaves both
  # alone (docs-deploy.sh). A final tag also publishes battinfo.ttl where w3id
  # serves the ontology from: battinfo/versions/X.Y.Z/, and the root when it is
  # the newest release.
  # (Requires GitHub Pages to be enabled from the gh-pages branch.)
  deploy:
    name: Deploy versioned docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    # One deploy at a time. Each pushes to gh-pages, so the deploy of a release
    # tag that ran next to the deploy of the main commit it was cut from would
    # be refused at the push. A running deploy is never cancelled, but GitHub
    # keeps only the newest waiting one: if a third deploy queues while a tag's
    # deploy waits, the tag's is cancelled, so re-run it from the tag's run.
    concurrency:
      group: docs-deploy-gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        env:
          DOCS_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: bash .github/workflows/docs-deploy.sh "$DOCS_VERSION"
