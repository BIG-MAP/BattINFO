# Checks every day what w3id serves for the last release (the newest vX.Y.Z tag):
#
# - release-terms: the v1 records context still holds every term of the last
#   release with the same value. The registry serves it from a vendored copy,
#   so a registry deploy or rollback that drops or changes a released term
#   turns this red. Terms that main has added since the release do not count:
#   v1 only ever gains terms, and the registry takes them at the next release.
#   release.yml compares every hosted file with the tag's copies before an
#   upload; this keeps watching afterwards.
# - ontology: https://w3id.org/battinfo declares the last release's versionIRI
#   and imports, and https://w3id.org/battinfo/X.Y.Z and the versionIRI serve
#   its battinfo.ttl. The tag's docs deploy publishes those files, so this is
#   checked after the release and never gates the upload.
name: Hosted files

on:
  schedule:
    - cron: "23 5 * * *"   # every day, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-terms:
    name: Hosted context keeps the released terms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The registry's host can take a minute to wake up, so each request is
      # tried up to six times, waiting 30 s longer each time.
      - name: Compare the hosted v1 context with the last release's terms
        run: python scripts/check_hosted_files.py --release-terms --attempts 6 --wait 30 --summary "$GITHUB_STEP_SUMMARY"

  ontology:
    name: Ontology IRIs serve the last release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The versionIRI goes through the registry, which can take a minute to wake up.
      - name: Check that the w3id ontology IRIs serve the last release's battinfo.ttl
        run: python scripts/check_hosted_files.py --ontology --attempts 6 --wait 30 --summary "$GITHUB_STEP_SUMMARY"
