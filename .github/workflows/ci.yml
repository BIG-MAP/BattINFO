name: CI

# Continuous integration for the battinfo package and its content.
# Runs on every push/PR, and is reusable (workflow_call) so the release
# pipeline can require it as a pre-publish gate. Tags are handled by
# release.yml, which invokes this workflow.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-extras --frozen --python 3.12
      - name: Ruff
        run: uv run --no-sync ruff check src tests scripts .tools
      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests scripts .tools
      - name: Mypy
        run: uv run --no-sync mypy

  test:
    name: Test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The classifiers in pyproject.toml name these versions, and
        # tests/test_packaging_metadata.py keeps the two lists and the docs in step.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-extras --frozen --python ${{ matrix.python-version }}
      - name: Unit tests + coverage gate
        run: uv run --no-sync pytest -q tests --cov=battinfo --cov-report=term-missing --cov-report=xml
      - name: Identifier-policy compliance
        run: uv run --no-sync python .tools/quality/lint_identifier_policy.py
      - name: Packaged examples are in sync with source
        run: uv run --no-sync python scripts/sync_examples.py --check
      # Hard gate. The LinkML slot_uri declarations are the single source of
      # truth for records.context.json; when this drifts, hand edits to the
      # shipped context are being silently overwritten on the next regeneration.
      - name: Records context is in sync with the schema
        run: uv run --no-sync python scripts/assemble_context.py --check
      - name: Hosted v1 context is in sync
        run: uv run --no-sync python scripts/gen_context.py --check
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  floors:
    # Every other job installs the locked, newest versions. This one installs
    # the lowest version of each requirement that pyproject.toml declares for
    # the core install and the publish and processing extras, on the oldest
    # supported Python, because those floors become permanent metadata once a
    # release is on PyPI. The requirements are read from pyproject.toml, so uv
    # treats them as direct ones; read from the wheel, they would count as
    # transitive and get the newest versions. uv sync is not used: uv.lock is
    # resolved for every extra at once, so a requirement of the dev or docs
    # extras can lift a core package above its floor.
    name: Dependency floors (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the lowest versions pyproject.toml allows
        run: |
          uv venv --python 3.11
          uv pip install --resolution lowest-direct -r pyproject.toml --extra publish --extra processing
          uv pip install --no-deps .
          uv pip install pytest pytest-timeout pytest-socket
      - name: Each requirement is installed at its floor
        run: |
          uv run --no-sync python - <<'PY'
          import tomllib
          from importlib.metadata import version

          from packaging.requirements import Requirement
          from packaging.version import Version

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          extras = project["optional-dependencies"]
          no_floor, lifted = [], []
          for raw in project["dependencies"] + extras["publish"] + extras["processing"]:
              requirement = Requirement(raw)
              floors = [Version(spec.version) for spec in requirement.specifier if spec.operator == ">="]
              installed = Version(version(requirement.name))
              print(f"{requirement.name:12} floor {', '.join(map(str, floors)) or 'none':10} installed {installed}")
              if len(floors) != 1:
                  no_floor.append(requirement.name)
              elif installed != floors[0]:
                  lifted.append(requirement.name)
          problems = []
          if no_floor:
              problems.append(f"Declare one >= floor for {', '.join(no_floor)}.")
          if lifted:
              problems.append(
                  f"Installed above the declared floor: {', '.join(lifted)}. Another requirement "
                  "needs a newer release, so raise the floor to the version installed here."
              )
          if problems:
              raise SystemExit(" ".join(problems))
          PY
      - name: Installed-package smoke test
        run: |
          uv run --no-sync python tests/installed_smoke.py
          uv run --no-sync battinfo --help > /dev/null
      # The tests that exercise these packages: the record models and
      # validation (pydantic, jsonschema, rdflib, pyld), the SHACL gate
      # (pyshacl), the CLI (typer, rich), the config file (PyYAML), the
      # workspace and deposit paths, conversion (batterydf), the dataset
      # previews (matplotlib, plotly) and RO-Crate validation (rocrate).
      - name: Tests that use these packages
        run: >-
          uv run --no-sync pytest -q
          tests/test_testmethod.py
          tests/test_bundle.py
          tests/test_validation_core.py
          tests/test_validation_record.py
          tests/test_jsonld_offline.py
          tests/test_examples_jsonld.py
          tests/test_record_roundtrip.py
          tests/test_publication_shacl_gate.py
          tests/test_ws_publish_gate.py
          tests/test_cli_query_create_publish.py
          tests/test_user_config.py
          tests/test_batch_init.py
          tests/test_acceptance_workflows.py
          tests/test_quickstart_recipe.py
          tests/test_authoring_ws.py
          tests/test_build_zenodo_package.py
          tests/test_lab_p1_traps.py
          tests/test_processing_artifacts.py
          tests/test_optional_extras.py

  notebooks:
    name: Guide notebooks execute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-extras --frozen --python 3.12
      - name: Execute guide notebooks (nbmake)
        run: uv run --no-sync pytest --nbmake docs/guides/ -q

  doc-snippets:
    name: Doc snippets execute
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --all-extras --frozen --python 3.12
      - name: Execute newcomer-path doc snippets
        run: uv run --no-sync python .tools/quality/run_doc_snippets.py

  web:
    # The website's validator runs the REAL canonical schemas; this job keeps
    # that honest: vendored schemas + examples must be in sync with the repo,
    # the browser validator must agree with the Python stack on the whole
    # examples corpus, and the site must build.
    name: Website (sync, agreement, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Vendored examples are in sync
        run: npm run sync:examples && git diff --exit-code lib/examples.generated.ts
      - name: Vendored schemas are in sync
        run: npm run sync:schemas -- --check
      - name: Vendored records context is in sync
        run: npm run sync:context -- --check
      - name: Browser validator agrees with the canonical corpus
        run: npm run check:agreement
      - name: JSON-LD workbench core checks
        run: npm run check:workbench
      - name: Create-page emitter terms match the records context
        run: npm run check:create-model
      - name: Build
        run: npm run build

  package:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine check dist/*
      # Smoke the built wheel against the *locked* dependency versions (what we
      # support and lock), not whatever floats latest from PyPI — otherwise the
      # smoke is non-deterministic. Dependency-bump compatibility is covered
      # separately by Dependabot PRs (which re-run this CI).
      - name: Install built wheel (locked deps) and smoke-test
        run: |
          uv sync --all-extras --frozen --python 3.12
          uv pip install --reinstall --no-deps dist/*.whl
          uv run --no-sync python -c "import battinfo; print('version', battinfo.__version__)"
          uv run --no-sync python tests/installed_smoke.py
          uv run --no-sync battinfo --help > /dev/null
      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          # Not "dist": release.yml runs this workflow as its CI gate and then
          # uploads its own "dist" artifact in the same run — a duplicate name
          # fails the second upload and would kill every release run.
          name: ci-dist
          path: dist/
